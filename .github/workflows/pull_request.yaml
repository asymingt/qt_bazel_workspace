# Pull request CI.
#
# Matrix: {linux, darwin, windows} x {amd64, arm64} x {bazel 9.x, last_rc}
# (12 jobs). Bazel 8 is not supported: rules_cc >= 0.2.21 (required by the
# hermetic llvm toolchain) needs Bazel 9's cc_runtimes toolchain type. Each job:
#   1. builds and runs every test natively on the runner
#      (`--config=host_<os>_<arch> --config=<os>_<arch>`), and
#   2. (currently disabled, see below) cross-compiles everything for every
#      *other* supported platform (`--platforms=@llvm//platforms:<os>_<arch>`)
#      using the hermetic LLVM toolchain.
#
# The cross-compile step is commented out until native builds are green on all
# six hosts and their disk caches are warm; running 6 full Qt builds per job on
# a cold cache does not fit in the 6h job limit.
#
# `push` on main is included only so that the Bazel caches get seeded from the
# default branch; PR runs then restore from those caches (actions/cache scope).
name: Pull Request

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}-${{ matrix.arch }} / bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # Pre-release Bazel is allowed to fail without blocking the PR.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        # "last_rc" is bazelisk's alias for the newest release candidate
        # (currently 10.0.0rc1); it is informational only, see continue-on-error.
        bazel: ["9.x", "last_rc"]
        include:
          - bazel: "last_rc"
            experimental: true
          # Per-(os, arch) runner image, native platform config, and the list of
          # all other platform configs to cross-compile for from that host.
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            platform: linux_amd64
            cross: linux_arm64 macos_amd64 macos_arm64 windows_amd64 windows_arm64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux_arm64
            cross: linux_amd64 macos_amd64 macos_arm64 windows_amd64 windows_arm64
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            platform: macos_amd64
            cross: linux_amd64 linux_arm64 macos_arm64 windows_amd64 windows_arm64
          - os: darwin
            arch: arm64
            runner: macos-15
            platform: macos_arm64
            cross: linux_amd64 linux_arm64 macos_amd64 windows_amd64 windows_arm64
          - os: windows
            arch: amd64
            runner: windows-2025
            platform: windows_amd64
            cross: linux_amd64 linux_arm64 macos_amd64 macos_arm64 windows_arm64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            platform: windows_arm64
            cross: linux_amd64 linux_arm64 macos_amd64 macos_arm64 windows_amd64

    env:
      # Bazelisk honours this over .bazelversion.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          # All caches below are backed by actions/cache and keyed per matrix
          # cell so that a given (os, arch, bazel) combination restores its own
          # artifacts on subsequent runs.
          bazelisk-cache: true
          disk-cache: ${{ matrix.os }}-${{ matrix.arch }}-bazel${{ matrix.bazel }}
          repository-cache: true
          cache-version: 1
          # Keep output paths short on Windows (MAX_PATH) and avoid writing
          # the output base into the checkout on any OS.
          bazelrc: |
            ${{ runner.os == 'Windows' && 'startup --output_user_root=C:/_bzl' || '' }}
            common --config=ci

      - name: Bazel version
        shell: bash
        run: bazel version

      - name: Analyze (native ${{ matrix.platform }})
        shell: bash
        run: >
          bazel build
          --nobuild
          --config=host_${{ matrix.platform }}
          --config=${{ matrix.platform }}
          //...

      - name: Build (native ${{ matrix.platform }})
        shell: bash
        run: >
          bazel build
          --config=host_${{ matrix.platform }}
          --config=${{ matrix.platform }}
          //...

      - name: Test (native ${{ matrix.platform }})
        shell: bash
        run: >
          bazel test
          --config=host_${{ matrix.platform }}
          --config=${{ matrix.platform }}
          //...

      # TODO: re-enable once native builds pass everywhere and caches are warm.
      # - name: Cross-compile from ${{ matrix.platform }} (${{ matrix.cross }})
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     for target in ${{ matrix.cross }}; do
      #       echo "::group::--platforms=@llvm//platforms:${target}"
      #       bazel build --config=host_${{ matrix.platform }} --config=${target} //...
      #       echo "::endgroup::"
      #     done

      - name: Force bazel shutdown to enable cache sync
        if: always()
        shell: bash
        run: >
          bazel shutdown

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}-${{ matrix.arch }}-bazel${{ matrix.bazel }}
          path: bazel-testlogs/**/test.log
          if-no-files-found: ignore
